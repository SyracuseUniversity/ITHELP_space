# .github/workflows/confluence-sync.yml
#
# Nightly export of approved Confluence Cloud spaces to Markdown in this repo.
# IBL consumes the repo via its GitHub tool; each commit is a reviewable diff
# of exactly what changed in the source-of-truth documentation.

name: Confluence Sync

on:
  schedule:
    # 07:00 UTC = 02:00 US/Eastern (03:00 during EDT). Off-peak for Atlassian.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Ignore the version cache and re-fetch every page body"
        type: boolean
        default: false

# Never let two syncs race on the same branch.
concurrency:
  group: confluence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests markdownify beautifulsoup4

      - name: Export Confluence spaces
        env:
          CONFLUENCE_BASE: ${{ vars.CONFLUENCE_BASE }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          SPACE_KEYS: ${{ vars.SPACE_KEYS }}
          OUTPUT_DIR: content
          FETCH_LABELS: "true"
          FORCE_FULL: ${{ inputs.force_full || 'false' }}
        run: python scripts/sync_confluence.py

      - name: Commit changes
        run: |
          git config user.name  "confluence-sync[bot]"
          git config user.email "confluence-sync@users.noreply.github.com"
          git add -A content/
          if git diff --staged --quiet; then
            echo "No documentation changes since last sync."
            exit 0
          fi
          git commit -m "Sync Confluence content ($(date -u +%Y-%m-%d))"
          git push

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Confluence sync"
            echo ""
            echo "Pages on disk: $(find content -name '*.md' | wc -l)"
            echo ""
            echo "Last commit:"
            echo '```'
            git log -1 --stat --oneline || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
